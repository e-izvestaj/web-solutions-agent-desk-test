name: Deploy latest Agent Desk QA build

on:
  push:
    paths:
      - '.github/workflows/qa-sync-latest-public.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified latest client build
        env:
          BUILD_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7fe0-81f4-9278-141741615b79/raw?se=2026-10-13T18%3A01%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=512cee44-9e0a-5402-8715-e825f6bb705b&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A25%3A14Z&ske=2026-10-14T00%3A25%3A14Z&sks=b&skv=2026-02-06&sig=uaAIWqnFLPlr0I7oSKpLZfNAv8eOo6R74qanrRMRDvE%3D'
        run: |
          curl -L --fail "$BUILD_URL" -o build.zip
          rm -rf /tmp/agent-desk-build
          mkdir -p /tmp/agent-desk-build
          unzip -q build.zip -d /tmp/agent-desk-build
          rm build.zip
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/agent-desk-build/ ./

      - name: Rewrite GitHub Pages base path for QA
        run: |
          sed -i 's#src="/assets/#src="/web-solutions-agent-desk-test/assets/#g' index.html
          sed -i 's#href="/assets/#href="/web-solutions-agent-desk-test/assets/#g' index.html
          grep -RIl --exclude-dir=.git --exclude-dir=.github '/web-solutions-public/' . | while read -r file; do
            sed -i 's#/web-solutions-public/#/web-solutions-agent-desk-test/#g' "$file"
          done

      - name: Verify latest Commerce editor and delete controls
        run: |
          JS_FILE=$(grep -o '/web-solutions-agent-desk-test/assets/index-[^" ]*\.js' index.html | head -n1 | sed 's#^/web-solutions-agent-desk-test/##')
          test -n "$JS_FILE"
          test -f "$JS_FILE"
          grep -q 'Ukloni kategoriju' "$JS_FILE"
          grep -q 'Ukloni artikal' "$JS_FILE"
          grep -q 'Forma za porudžbinu' "$JS_FILE"

      - name: Commit QA deployment
        run: |
          git config user.name "e-izvestaj"
          git config user.email "dragan@retailmediacenter.com"
          rm -f .github/workflows/qa-sync-latest-public.yml
          git add -A
          git commit -m "Deploy latest Agent Desk Commerce QA build"
          git push
