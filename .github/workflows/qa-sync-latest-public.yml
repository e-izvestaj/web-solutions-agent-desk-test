name: Sync latest Web Solutions build to Agent Desk QA

on:
  push:
    paths:
      - '.github/workflows/qa-sync-latest-public.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest verified public build
        run: |
          git clone --depth 1 https://github.com/retailmediacenter/web-solutions-public.git /tmp/web-solutions-public
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/web-solutions-public/ ./

      - name: Rewrite GitHub Pages base path for QA
        run: |
          grep -RIl --exclude-dir=.git --exclude-dir=.github '/web-solutions-public/' . | while read -r file; do
            sed -i 's#/web-solutions-public/#/web-solutions-agent-desk-test/#g' "$file"
          done

      - name: Verify Agent Desk bundle contains latest Commerce controls
        run: |
          JS_FILE=$(grep -o '/web-solutions-agent-desk-test/assets/index-[^" ]*\.js' index.html | head -n1 | sed 's#^/web-solutions-agent-desk-test/##')
          test -n "$JS_FILE"
          test -f "$JS_FILE"
          grep -q 'Ukloni kategoriju' "$JS_FILE"
          grep -q 'Ukloni artikal' "$JS_FILE"
          grep -q 'Forma za porudžbinu' "$JS_FILE"

      - name: Commit QA deployment and remove one-shot workflow
        run: |
          git config user.name "e-izvestaj"
          git config user.email "dragan@retailmediacenter.com"
          rm -f .github/workflows/qa-sync-latest-public.yml
          git add -A
          if git diff --cached --quiet; then
            echo "QA repository is already current."
            exit 0
          fi
          git commit -m "Deploy latest Agent Desk Commerce QA build"
          git push
