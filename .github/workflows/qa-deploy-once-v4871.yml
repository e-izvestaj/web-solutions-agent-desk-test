name: Deploy V48.7.1 Agent Desk QA once

on:
  push:
    paths: ['.github/workflows/qa-deploy-once-v4871.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested QA build
        env:
          BUILD_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-f2a8-8211-beca-0ec02876dbe0/raw?se=2026-10-13T10%3A30%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=2dcff1a6-900a-5c1c-969f-edcdb6425371&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T02%3A44%3A41Z&ske=2026-10-14T02%3A44%3A41Z&sks=b&skv=2026-02-06&sig=Hlof2kLme16jCeRGq9wFMqaOhF0FVE8yfXeg3mbVhXs%3D'
        run: |
          curl -L --fail "$BUILD_URL" -o build.zip
          unzip -q -o build.zip index.html assets/index-Di9V-WY3.js assets/index-BGUc7lEu.css visual-system.css site-system.css -d .
          rm build.zip
      - name: Commit QA bundle and remove one-shot workflow
        run: |
          git config user.name "e-izvestaj"
          git config user.email "dragan@retailmediacenter.com"
          rm .github/workflows/qa-deploy-once-v4871.yml
          git add index.html assets/index-Di9V-WY3.js assets/index-BGUc7lEu.css visual-system.css site-system.css .github/workflows/qa-deploy-once-v4871.yml
          git commit -m "Deploy V48.7.1 Agent Desk QA bundle"
          git push
