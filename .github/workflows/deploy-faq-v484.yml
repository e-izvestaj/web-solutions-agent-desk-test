name: Deploy V48.4 FAQ QA build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-faq-v484.yml']

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested Agent Desk build
        run: |
          curl --fail --location --retry 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6058-8211-b4bf-20f2b0a70af5/raw?se=2026-10-12T13%3A58%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=510acf67-b848-5c88-86e5-8c3ffaf436f3&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T04%3A01%3A48Z&ske=2026-10-13T04%3A01%3A48Z&sks=b&skv=2026-02-06&sig=I/J98kGJM1NbY61p0ly6/FVy2whtLwSkwG3h%2BTDYpdw%3D' -o /tmp/faq-dist.zip
          rm -rf /tmp/faq-dist
          mkdir -p /tmp/faq-dist
          unzip -q /tmp/faq-dist.zip -d /tmp/faq-dist
      - name: Install tested frontend assets
        run: |
          cp /tmp/faq-dist/index.html ./index.html
          mkdir -p assets
          cp /tmp/faq-dist/assets/index-Otfrx6BJ.js assets/index-Otfrx6BJ.js
          cp /tmp/faq-dist/assets/index-BGUc7lEu.css assets/index-BGUc7lEu.css
          touch .nojekyll
      - name: Commit deployment and remove transfer workflow
        run: |
          git config user.name "e-izvestaj"
          git config user.email "dragan@retailmediacenter.com"
          git rm .github/workflows/deploy-faq-v484.yml
          git add index.html assets/index-Otfrx6BJ.js assets/index-BGUc7lEu.css .nojekyll
          git commit -m "Deploy V48.4 FAQ editor"
          git push origin main
