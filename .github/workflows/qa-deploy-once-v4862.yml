name: Deploy V48.6.2 Agent Desk QA once

on:
  push:
    paths: ['.github/workflows/qa-deploy-once-v4862.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested QA build
        env:
          BUILD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-cac4-8210-a2f7-ce56fd67ae99/raw?se=2026-10-13T09%3A53%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=9020ff6b-cece-52d3-8b1d-e6ffa0d96e9a&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T02%3A32%3A25Z&ske=2026-10-14T02%3A32%3A25Z&sks=b&skv=2026-02-06&sig=UrFY%2B0onM1P/PpRpRvlHzS3zQyvRss7NoeSmptcFQdM%3D'
        run: |
          curl -L --fail "$BUILD_URL" -o build.zip
          unzip -q -o build.zip index.html assets/index-Dsi93oT7.js assets/index-BGUc7lEu.css -d .
          rm build.zip
      - name: Commit QA bundle and remove one-shot workflow
        run: |
          git config user.name "e-izvestaj"
          git config user.email "dragan@retailmediacenter.com"
          rm .github/workflows/qa-deploy-once-v4862.yml
          git add index.html assets/index-Dsi93oT7.js assets/index-BGUc7lEu.css .github/workflows/qa-deploy-once-v4862.yml
          git commit -m "Deploy V48.6.2 Agent Desk QA bundle"
          git push
